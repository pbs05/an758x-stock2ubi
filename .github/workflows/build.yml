name: Build AN758x-Stock2UBI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '手动运行时创建的 Release Tag（留空则只构建不发布）'
        required: false
        default: ''
      release_name:
        description: 'Release 标题（留空则使用 Tag 名）'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        run: >-
          rustup toolchain install stable --profile minimal
          --component clippy,rustfmt
          --target aarch64-unknown-linux-musl

      - name: Check formatting
        run: cargo +stable fmt --all -- --check

      - name: Run tests
        run: cargo +stable test --locked

      - name: Check host code
        run: cargo +stable clippy --locked --all-targets -- -D warnings

      - name: Check target code
        run: >-
          cargo +stable clippy --locked --target aarch64-unknown-linux-musl
          --all-targets -- -D warnings

      - name: Cross-build
        run: cargo +stable build --locked --release --target aarch64-unknown-linux-musl

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: an758x-stock2ubi-aarch64
          path: target/aarch64-unknown-linux-musl/release/an758x-stock2ubi
          if-no-files-found: error

  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: an758x-stock2ubi-aarch64
          path: release

      - name: Resolve tag name
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
            echo "title=${{ inputs.release_name || inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "title=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ steps.meta.outputs.tag }}"
          release/an758x-stock2ubi
          --title "${{ steps.meta.outputs.title }}"
          --generate-notes --repo "$GITHUB_REPOSITORY"
